version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:64322/postgres
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:64322/postgres
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
