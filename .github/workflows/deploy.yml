name: Deploy to Kubernetes

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Note: For production, you will need to set up cluster authentication here
      # (e.g., Azure login, AWS credentials, GCP auth, or kubeconfig secrets)
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
        if: "${{ secrets.KUBECONFIG != '' }}"

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deploy.yml
