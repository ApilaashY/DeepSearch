name: Deploy to Oracle

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log in to Oracle Cloud Infrastructure (OCI) using your secrets
      - name: Configure OCI CLI
        uses: oracle-actions/setup-oci@v1
        with:
          user_ocid: ${{ secrets.OCI_USER_OCID }}
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          key_content: ${{ secrets.OCI_KEY_CONTENT }}
          region: ${{ secrets.OCI_REGION }}

      # Download the kubeconfig from your Oracle Kubernetes (OKE) cluster
      - name: Get OKE Kubeconfig
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig --cluster-id ${{ secrets.OKE_CLUSTER_OCID }} --file ~/.kube/config --region ${{ secrets.OCI_REGION }} --token-version 2.0.0

      # Apply your Kubernetes configuration
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deploy.yml
