apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepsearch-deploy
  labels:
    app: deepsearch-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepsearch-deploy
  template:
    metadata:
      labels:
        app: deepsearch-deploy
    spec:
      containers:
        - name: deepsearch-deploy
          image: docker.io/apilaash/deepsearch-deploy:latest # The image tag you built
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
---
apiVersion: v1
kind: Service
metadata:
  name: deepsearch-service
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: 'flexible'
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: '10'
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: '10'
spec:
  type: LoadBalancer
  selector:
    app: deepsearch-deploy
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080 # Exposes the app at <node-ip>:30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepsearch-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTPS'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deepsearch-service
                port:
                  number: 3000
